name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#7F7FD5&color_dots=#ebedf0,#c6d2f5,#a4b6ee,#86A8E7,#7F7FD5
            dist/snake-dark.svg?palette=github-dark&color_snake=#91EAE4&color_dots=#161b22,#24345a,#3b5590,#86A8E7,#91EAE4
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
